name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    name: Build and publish APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.4
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter test

      # Optional: sign with a real key when the repository secrets exist.
      # Otherwise the release APK is signed with the debug key.
      - name: Configure release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
          {
            echo "storeFile=upload-keystore.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > android/key.properties

      - run: flutter build apk --release
      - name: Build demo APK (virtual peers, no radio needed)
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk trama-${{ github.ref_name }}.apk
          flutter build apk --release --dart-define=DEMO_MODE=true
          cp build/app/outputs/flutter-apk/app-release.apk trama-demo-${{ github.ref_name }}.apk

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            trama-${{ github.ref_name }}.apk
            trama-demo-${{ github.ref_name }}.apk
          generate_release_notes: true
